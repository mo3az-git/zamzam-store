name: Consolidated MVP — Targeted Compatibility Checks

on:
  push:
    branches:
      - "integration/mvp-consolidated-*"
  pull_request:
    branches:
      - "integration/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated:
    name: Frontend + backend build, migration, and interface checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zamzam_consolidation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-integration-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d zamzam_consolidation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:disposable-integration-only@127.0.0.1:5432/zamzam_consolidation
      REDIS_URL: redis://127.0.0.1:6379
      LOCKING_REDIS_URL: redis://127.0.0.1:6379
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:8000,http://localhost:9000
      JWT_SECRET: local-ci-jwt-secret-only-0123456789abcdef
      COOKIE_SECRET: local-ci-cookie-secret-only-0123456789abcdef
      PHASE1_DISABLE_ADMIN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --strict-peer-deps --no-audit --no-fund
      - name: Storefront unit tests (not formal TP)
        run: node --experimental-strip-types --test apps/storefront/tests/*.test.mjs
      - name: Read-only native payable quote unit tests (not formal TP)
        run: node --experimental-strip-types --test apps/backend/scripts/test-mvp-payment-quote.mjs
      - name: Guest session transport contract (not formal TP)
        run: node --experimental-strip-types --test apps/backend/scripts/test-guest-cart-session-transport.mjs
      - name: Cart mutation boundary regression (not formal TP)
        run: node apps/backend/scripts/test-cart-mutation-boundary.mjs
      - name: Cart completion remains disabled until authorized checkout is wired
        run: node --experimental-strip-types --test apps/backend/scripts/test-cart-completion-disabled.test.mjs
      - name: Native cart ownership route authorization (not formal TP)
        run: node --experimental-strip-types --test apps/backend/scripts/test-guest-cart-ownership-route-policy.mjs
      - name: Guest checkout read-only preflight (not formal TP)
        run: node --experimental-strip-types apps/backend/scripts/test-guest-checkout-preflight.mjs
      - name: Cross-layer governorate/Medusa province code contract (not formal TP)
        run: node --experimental-strip-types --test apps/storefront/tests/governorate-contract.test.mjs
      - name: Canonical 27-governorate shipping policy checks (not formal TP)
        run: node apps/backend/scripts/check-egypt-shipping-configuration.mjs
      - name: Checkout shipping quote readiness contract (not formal TP)
        run: node apps/backend/scripts/check-shipping-quote-readiness-contract.mjs
      - name: Internal batch availability projection tests (not formal TP)
        run: node --experimental-strip-types --test apps/backend/scripts/test-batch-availability.mjs
      - name: FEFO lock-key validation unit test (not formal TP)
        run: node apps/backend/scripts/check-locking-empty-keys-unit.mjs
      - name: Disposable Redis locking edge checks (not formal TP)
        run: node apps/backend/scripts/check-locking-redis-edge-cases.mjs
      - name: Scoped product visibility authorization tests (not formal TP)
        run: node --experimental-strip-types --test apps/backend/scripts/test-store-visibility.mjs
      - name: Lint both workspaces
        run: npm run lint
      - name: Migrate disposable Medusa database
        run: npm run db:migrate
        env:
          TS_NODE_PROJECT: ${{ github.workspace }}/apps/backend/tsconfig.json
      - name: Real guest cart ownership integration — isolated approved disposable database (not formal TP)
        env:
          PHASE1_DISPOSABLE_TEST_PROFILE: "ci_ephemeral_service"
          TS_NODE_PROJECT: ${{ github.workspace }}/apps/backend/tsconfig.json
        run: |
          set -euo pipefail
          # Preserve the Phase 3 disposable database and never broaden the Phase 1 validator.
          # An explicitly approved second database is used for guest ownership tests.
          node <<'NODE'
          const { Client } = require("pg")
          const url = new URL(process.env.DATABASE_URL)
          if (process.env.GITHUB_ACTIONS !== "true" ||
              process.env.PHASE1_DISPOSABLE_TEST_PROFILE !== "ci_ephemeral_service" ||
              url.hostname !== "127.0.0.1" || url.port !== "5432" ||
              url.pathname !== "/zamzam_consolidation") {
            throw new Error("Refusing to prepare guest ownership database on an unapproved target")
          }
          ;(async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL })
            await client.connect()
            try { await client.query("CREATE DATABASE zamzam_spike") }
            finally { await client.end() }
          })().catch((error) => {
            console.error("Failed preparing guest ownership disposable database:", error.code || "unknown")
            process.exitCode = 1
          })
          NODE
          export DATABASE_URL="${DATABASE_URL%/*}/zamzam_spike"
          npm run db:migrate
          node apps/backend/scripts/test-guest-cart-ownership-integration.mjs
          # Native cart address/shipping/payable checks reuse the approved disposable Medusa instance.
          # No service zones, shipping prices, orders, or payment configuration are created.
          node apps/backend/scripts/test-native-shipping-readiness.mjs
          # Disposable 27-province fulfillment zones, without shipping options or rates.
          node apps/backend/scripts/test-egypt-governorate-shipping-integration.mjs
      - name: Real PostgreSQL FEFO availability integration (not formal TP)
        run: node --experimental-strip-types --test apps/backend/scripts/test-batch-availability-postgres.mjs
        env:
          PHASE3_INVENTORY_DISPOSABLE_TEST: "true"
      - name: Live Medusa Query sales-channel visibility integration (not formal TP)
        run: node apps/backend/scripts/test-store-visibility-medusa.mjs
        env:
          PHASE3_MEDUSA_VISIBILITY_CI: "true"
      - name: Build backend
        run: npm run build:backend
        env:
          NODE_ENV: production
      - name: Build storefront
        run: npm run build:storefront
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Validate proposed API boundaries
        run: python -m unittest discover -s contracts -p 'test_mvp_interface.py' -v
