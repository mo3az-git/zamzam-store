name: MVP Interface Contract Validation

on:
  push:
    branches:
      - "integration/mvp-interface-contract-v1-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    name: Validate proposed browser/backend payloads (no TP execution)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Validate schema and fail-closed examples
        run: python -m unittest discover -s contracts -p 'test_mvp_interface.py' -v
